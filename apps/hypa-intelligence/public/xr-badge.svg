<svg width="155" height="48" viewBox="0 0 155 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="154" height="47" rx="5.5" fill="black" stroke="#A6A6A6"/>
  <!-- VR Headset Icon -->
  <g transform="translate(9, 11)">
    <!-- Strap -->
    <path d="M4 10C4 3 20 3 20 10" stroke="#CCCCCC" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Headset body -->
    <rect x="1" y="8" width="22" height="14" rx="4" stroke="#EEEEEE" stroke-width="1.6" fill="#1A1A1A"/>
    <!-- Left lens -->
    <circle cx="8.5" cy="15" r="3.2" fill="#4A90D9" fill-opacity="0.25" stroke="#5B9FE8" stroke-width="1.2"/>
    <!-- Right lens -->
    <circle cx="15.5" cy="15" r="3.2" fill="#9B72CF" fill-opacity="0.25" stroke="#AB85D9" stroke-width="1.2"/>
    <!-- Nose bridge -->
    <path d="M11.3 18.2Q12 19.2 12.7 18.2" stroke="#AAAAAA" stroke-width="0.8" fill="none"/>
    <!-- Lens reflections -->
    <circle cx="7.2" cy="13.8" r="0.8" fill="white" fill-opacity="0.2"/>
    <circle cx="14.2" cy="13.8" r="0.8" fill="white" fill-opacity="0.2"/>
  </g>
  <!-- "Coming Soon" small text -->
  <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="white" font-weight="400" letter-spacing="0.3">Coming Soon</text>
  <!-- "XR Platforms" large text -->
  <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="600" letter-spacing="0.2">XR Platforms</text>
</svg>
